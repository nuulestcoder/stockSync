openapi: 3.0.3
info:
  title: Nzo Stock Manager API
  description: |
    REST API for the Nzo Stock Manager multi-tenant inventory application.

    Import this file into Postman to generate a collection. Set the
    `baseUrl` and `accessToken` collection variables after import.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
  - name: Authentication
  - name: Products
  - name: Uploads
paths:
  /health:
    get:
      tags: [System]
      summary: Check API health
      operationId: healthCheck
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a company and its first administrator
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access and refresh tokens
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Search by product name or variant SKU
          schema:
            type: string
        - name: brand
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      tags: [Products]
      summary: Get a product
      operationId: getProduct
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Products]
      summary: Update product fields
      operationId: updateProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Products]
      summary: Soft-delete a product
      operationId: deleteProduct
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/products/{id}/variants:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    post:
      tags: [Products]
      summary: Add a variant to a product
      operationId: addProductVariant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVariantRequest"
      responses:
        "201":
          description: Variant added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/products/{id}/variants/{variantId}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: variantId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
    put:
      tags: [Products]
      summary: Update a product variant
      operationId: updateProductVariant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVariantRequest"
      responses:
        "200":
          description: Variant updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Products]
      summary: Delete a product variant
      operationId: deleteProductVariant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Variant deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/uploads/single:
    post:
      tags: [Uploads]
      summary: Upload one image
      operationId: uploadSingleFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, GIF, or WebP image up to 10 MB
      responses:
        "201":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/uploads/multiple:
    post:
      tags: [Uploads]
      summary: Upload multiple images
      operationId: uploadMultipleFiles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
                  description: JPEG, PNG, GIF, or WebP images up to 10 MB each
      responses:
        "201":
          description: Files uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 20

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
        message:
          type: string
        error:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
        message:
          type: string
          example: error
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    RegisterRequest:
      type: object
      required: [company, name, email, password]
      properties:
        company:
          $ref: "#/components/schemas/CreateCompanyRequest"
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 8

    CreateCompanyRequest:
      type: object
      required: [name, address, contact, plan]
      properties:
        name:
          type: string
        address:
          $ref: "#/components/schemas/CompanyAddress"
        contact:
          $ref: "#/components/schemas/CompanyContact"
        billing:
          $ref: "#/components/schemas/CompanyBilling"
        settings:
          $ref: "#/components/schemas/CompanySettings"
        plan:
          type: string
          enum: [starter, pro, enterprise]

    CompanyAddress:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        country:
          type: string
          example: SN

    CompanyContact:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        whatsapp:
          type: string

    CompanyBilling:
      type: object
      properties:
        ninea:
          type: string
        rccm:
          type: string

    CompanySettings:
      type: object
      properties:
        currency:
          type: string
          example: XOF
        invoicePrefix:
          type: string
          example: NZO
        invoiceCounter:
          type: integer
          readOnly: true
        taxRate:
          type: number
          format: double
        paymentMethods:
          type: array
          items:
            type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TokenData"

    TokenData:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserSummary"

    UserSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectID"
        companyId:
          $ref: "#/components/schemas/ObjectID"
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, MANAGER, SELLER]

    CreateProductRequest:
      type: object
      required: [name, brand, category, variants]
      properties:
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        description:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            type: string
        variants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Variant"

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        description:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            type: string

    CreateVariantRequest:
      type: object
      required: [sku, price]
      properties:
        sku:
          type: string
        specs:
          $ref: "#/components/schemas/VariantSpecs"
        price:
          $ref: "#/components/schemas/Price"
        images:
          type: array
          items:
            type: string
            format: uri

    UpdateVariantRequest:
      type: object
      properties:
        sku:
          type: string
        specs:
          $ref: "#/components/schemas/VariantSpecs"
        price:
          $ref: "#/components/schemas/Price"
        images:
          type: array
          items:
            type: string
            format: uri

    Variant:
      allOf:
        - $ref: "#/components/schemas/CreateVariantRequest"
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/ObjectID"

    VariantSpecs:
      type: object
      properties:
        cpu:
          type: string
        ram:
          type: string
        storage:
          type: string
        color:
          type: string
        condition:
          type: string
          enum: [new, refurbished]

    Price:
      type: object
      properties:
        buying:
          type: number
          format: double
        selling:
          type: number
          format: double
        currency:
          type: string
          default: XOF
          example: XOF

    Product:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectID"
        companyId:
          $ref: "#/components/schemas/ObjectID"
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        description:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Product"

    ProductListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/Product"
                meta:
                  $ref: "#/components/schemas/PaginationMeta"

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    UploadFile:
      type: object
      properties:
        key:
          type: string
        url:
          type: string
          format: uri
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64

    UploadResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UploadFile"

    UploadListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/UploadFile"

    ObjectID:
      type: string
      pattern: "^[a-fA-F0-9]{24}$"
      example: 507f1f77bcf86cd799439011
