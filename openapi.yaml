openapi: 3.0.3
info:
  title: Nzo Stock Manager API
  description: |
    REST API for the Nzo Stock Manager multi-tenant inventory application.

    Import this file into Postman to generate a collection. Set the
    `baseUrl` and `accessToken` collection variables after import.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
  - name: Authentication
  - name: Products
  - name: Stock
  - name: Sales
  - name: Uploads
paths:
  /health:
    get:
      tags: [System]
      summary: Check API health
      operationId: healthCheck
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a company and its first administrator
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access and refresh tokens
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Search by product name or variant SKU
          schema:
            type: string
        - name: brand
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      tags: [Products]
      summary: Get a product
      operationId: getProduct
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Products]
      summary: Update product fields
      operationId: updateProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Products]
      summary: Soft-delete a product
      operationId: deleteProduct
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/products/{id}/variants:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    post:
      tags: [Products]
      summary: Add a variant to a product
      operationId: addProductVariant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVariantRequest"
      responses:
        "201":
          description: Variant added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/products/{id}/variants/{variantId}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - name: variantId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
    put:
      tags: [Products]
      summary: Update a product variant
      operationId: updateProductVariant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVariantRequest"
      responses:
        "200":
          description: Variant updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Products]
      summary: Delete a product variant
      operationId: deleteProductVariant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Variant deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/uploads/single:
    post:
      tags: [Uploads]
      summary: Upload one image
      operationId: uploadSingleFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, GIF, or WebP image up to 10 MB
      responses:
        "201":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/uploads/multiple:
    post:
      tags: [Uploads]
      summary: Upload multiple images
      operationId: uploadMultipleFiles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
                  description: JPEG, PNG, GIF, or WebP images up to 10 MB each
      responses:
        "201":
          description: Files uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sales:
    get:
      tags: [Sales]
      summary: List sales
      operationId: listSales
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, confirmed, paid, cancelled, refunded]
      responses:
        "200":
          description: Sales retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Sales]
      summary: Create a draft sale
      description: Creates a sale without processing payment. New sales start in draft status.
      operationId: createSale
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleRequest"
      responses:
        "201":
          description: Sale created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/sales/dashboard:
    get:
      tags: [Sales]
      summary: Get sales dashboard metrics
      operationId: getSalesDashboard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: Sales dashboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleDashboardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sales/reports:
    get:
      tags: [Sales]
      summary: Get sales reports
      description: Returns the same aggregated sales reporting data as the sales dashboard.
      operationId: getSalesReports
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: Sales reports retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleDashboardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sales/{id}:
    parameters:
      - $ref: "#/components/parameters/SaleID"
    get:
      tags: [Sales]
      summary: Get a sale
      operationId: getSale
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sale retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sales/{id}/status:
    parameters:
      - $ref: "#/components/parameters/SaleID"
    put:
      tags: [Sales]
      summary: Transition a sale status
      description: >
        Managers and administrators can confirm, mark paid, cancel, or refund a sale.
        Status transitions reserve, consume, release, or return stock as appropriate.
        Payment processing itself is not implemented in the MVP.
      operationId: updateSaleStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSaleStatusRequest"
      responses:
        "200":
          description: Sale status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stock:
    get:
      tags: [Stock]
      summary: List stock records
      operationId: listStock
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: location
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stock retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stock/alerts:
    get:
      tags: [Stock]
      summary: List low-stock records
      operationId: listStockAlerts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Stock alerts retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stock/dashboard:
    get:
      tags: [Stock]
      summary: Get stock dashboard metrics
      operationId: getStockDashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stock dashboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDashboardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stock/{variantId}:
    parameters:
      - $ref: "#/components/parameters/VariantID"
    get:
      tags: [Stock]
      summary: Get stock for a variant
      operationId: getVariantStock
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stock retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stock/{variantId}/movements:
    parameters:
      - $ref: "#/components/parameters/VariantID"
    get:
      tags: [Stock]
      summary: List movements for a variant
      operationId: listVariantStockMovements
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Stock movements retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stock/{variantId}/move:
    parameters:
      - $ref: "#/components/parameters/VariantID"
    post:
      tags: [Stock]
      summary: Apply an immediate stock movement
      description: Requires ADMIN or MANAGER role. Serial numbers are reserved for a future implementation.
      operationId: moveStock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveStockRequest"
      responses:
        "200":
          description: Stock movement applied successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMoveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/stock/requests:
    get:
      tags: [Stock]
      summary: List stock requests
      operationId: listStockRequests
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          schema:
            type: string
            enum: [INBOUND, OUTBOUND]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, processing, completed, cancelled, rejected]
      responses:
        "200":
          description: Stock requests retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockRequestListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stock/requests/inbound:
    post:
      tags: [Stock]
      summary: Create an inbound stock request
      description: Creates a pending request. Managers or admins can approve and complete it.
      operationId: createInboundStockRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockRequest"
            example:
              type: INBOUND
              reason: Supplier delivery
              reference: PO-2026-001
              items:
                - productId: 507f1f77bcf86cd799439011
                  variantId: 507f1f77bcf86cd799439012
                  quantity: 10
      responses:
        "201":
          description: Stock request created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stock/requests/outbound:
    post:
      tags: [Stock]
      summary: Create an outbound stock request
      description: Creates a pending request. Sellers, managers, or admins can create outbound requests.
      operationId: createOutboundStockRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockRequest"
            example:
              type: OUTBOUND
              reason: Customer sale
              reference: SALE-2026-001
              items:
                - productId: 507f1f77bcf86cd799439011
                  variantId: 507f1f77bcf86cd799439012
                  quantity: 1
      responses:
        "201":
          description: Stock request created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stock/requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Stock]
      summary: Approve a stock request
      description: Requires ADMIN or MANAGER role. Only pending requests can be approved.
      operationId: approveStockRequest
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stock request approved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/stock/requests/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Stock]
      summary: Reject a stock request
      description: Requires ADMIN or MANAGER role. Only pending requests can be rejected.
      operationId: rejectStockRequest
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stock request rejected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/stock/requests/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Stock]
      summary: Cancel a stock request
      description: Cancelling a completed, rejected, or already cancelled request is not allowed.
      operationId: cancelStockRequest
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stock request cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/stock/requests/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Stock]
      summary: Complete a stock request
      description: Requires ADMIN or MANAGER role. Completion applies IN or OUT movements for every item and is allowed only after approval.
      operationId: completeStockRequest
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stock request completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 20
    VariantID:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    RequestID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    SaleID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    ReportFrom:
      name: from
      in: query
      description: Inclusive report start timestamp in RFC3339 format
      schema:
        type: string
        format: date-time
    ReportTo:
      name: to
      in: query
      description: Exclusive report end timestamp in RFC3339 format
      schema:
        type: string
        format: date-time

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
        message:
          type: string
        error:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
        message:
          type: string
          example: error
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    RegisterRequest:
      type: object
      required: [company, name, email, password]
      properties:
        company:
          $ref: "#/components/schemas/CreateCompanyRequest"
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 8

    CreateCompanyRequest:
      type: object
      required: [name, address, contact, plan]
      properties:
        name:
          type: string
        address:
